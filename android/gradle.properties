# Sized for a 16 GB machine. The previous -Xmx8G with a 4G metaspace let the
# Gradle JVM claim ~12.5 GB, leaving too little for the Dart AOT compiler and
# the font-subsetting subprocess, which the OS then SIGKILLed (build failed
# with "Font subsetting failed with exit code -9"). 4G is ample for this module.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
