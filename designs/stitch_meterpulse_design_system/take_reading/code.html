<script>
    // Animation for the scan line
    const scanLine = document.getElementById('scan-line');
    let position = 0;
    let direction = 1;

    function animateScan() {
      position += 0.8 * direction;
      if (position >= 128 || position <= 0) {
        direction *= -1;
      }
      scanLine.style.top = position + 'px';
      requestAnimationFrame(animateScan);
    }
    animateScan();

    // Visual feedback for detection
    const boxes = document.querySelectorAll('.border-secondary-container');
    setInterval(() => {
      boxes.forEach(box => {
        box.style.opacity = Math.random() > 0.1 ? '1' : '0.4';
      });
    }, 150);
